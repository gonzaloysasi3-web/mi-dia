<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Séneca</title>
<meta name="description" content="Tareas, citas, exámenes y hábitos del día en un solo lugar.">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Séneca">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-inicio" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="i-hoy" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></symbol>
    <symbol id="i-semana" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></symbol>
    <symbol id="i-exam" viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8 4.5 4 4.5v13c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-13c-4 0-6.5.5-8 2ZM12 6.5v13"/></symbol>
    <symbol id="i-habitos" viewBox="0 0 24 24"><path d="m17 3 3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></symbol>
    <symbol id="i-event" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5.5 12.5 4.2 4.2L18.5 8"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7.5 18a4.25 4.25 0 0 1-.7-8.45A6 6 0 0 1 18.2 10 4 4 0 0 1 17.5 18Z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5.5v13M15 5.5v13"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M12 10v3.5l2 1.5M10 3h4"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M6 18.5V5.5A1.5 1.5 0 0 1 7.5 4H18v13H7.5A1.5 1.5 0 0 0 6 18.5Zm0 0A1.5 1.5 0 0 0 7.5 20H18"/></symbol>
    <symbol id="i-game" viewBox="0 0 24 24"><rect x="3" y="7.5" width="18" height="10" rx="5"/><path d="M8 10.5v4M6 12.5h4M15.5 11.5h.01M17.5 13.5h.01"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M5 4.5v15M9 4.5v15M13.5 5.5l4 13.5M3.5 19.5h17"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H17v3"/><rect x="4" y="8" width="16" height="11" rx="2.5"/><path d="M16 13.5h.01" stroke-width="3"/></symbol>
    <symbol id="i-counter" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M7.5 12h4M9.5 10v4M14 12h3"/></symbol>
    <symbol id="i-class" viewBox="0 0 24 24"><path d="M3 9.5 12 5l9 4.5-9 4.5Z"/><path d="M7 11.5V16c1.5 1.4 3.2 2 5 2s3.5-.6 5-2v-4.5M21 9.5V14"/></symbol>
    <symbol id="i-review" viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="16" rx="2.5"/><path d="M9 4.5V6h6V4.5M8.5 13l2.5 2.5 4.5-5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><path d="M6 12h.01M12 12h.01M18 12h.01" stroke-width="3"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 3.5h4M6 7l1 12.5h10L18 7M10 11v5M14 11v5"/></symbol>
  </defs>
</svg>

<div class="app">
  <nav class="nav" aria-label="Secciones">
    <div class="brand" aria-hidden="true">Séneca</div>
    <button type="button" data-view="inicio"><svg class="i" aria-hidden="true"><use href="#i-inicio"/></svg><span>Inicio</span></button>
    <button type="button" data-view="hoy"><svg class="i" aria-hidden="true"><use href="#i-hoy"/></svg><span>Hoy</span></button>
    <button type="button" data-view="semana"><svg class="i" aria-hidden="true"><use href="#i-semana"/></svg><span>Semana</span></button>
    <button type="button" data-view="examenes"><svg class="i" aria-hidden="true"><use href="#i-exam"/></svg><span>Exámenes</span></button>
    <button type="button" data-view="horario" class="nav-extra"><svg class="i" aria-hidden="true"><use href="#i-class"/></svg><span>Horario</span></button>
    <button type="button" data-view="habitos" class="nav-extra"><svg class="i" aria-hidden="true"><use href="#i-habitos"/></svg><span>Hábitos</span></button>
    <button type="button" data-view="biblioteca" class="nav-extra"><svg class="i" aria-hidden="true"><use href="#i-library"/></svg><span>Biblioteca</span></button>
    <button type="button" data-view="cartera" class="nav-extra"><svg class="i" aria-hidden="true"><use href="#i-wallet"/></svg><span>Cartera</span></button>
    <button type="button" data-view="contadores" class="nav-extra"><svg class="i" aria-hidden="true"><use href="#i-counter"/></svg><span>Contadores</span></button>
    <button type="button" data-view="revision" class="nav-extra"><svg class="i" aria-hidden="true"><use href="#i-review"/></svg><span>Revisión</span></button>
    <button type="button" data-view="ajustes" class="nav-extra"><svg class="i" aria-hidden="true"><use href="#i-settings"/></svg><span>Ajustes</span></button>
    <button type="button" data-view="mas" class="nav-more"><svg class="i" aria-hidden="true"><use href="#i-more"/></svg><span>Más</span></button>
  </nav>

  <main id="main">
    <header class="top">
      <div class="heading">
        <h1 id="title">Hoy</h1>
        <p id="sub" class="sub"></p>
      </div>
      <div class="actions">
        <button type="button" id="syncBtn" class="icon-btn" aria-label="Sincronizar entre dispositivos"><svg class="i" aria-hidden="true"><use href="#i-cloud"/></svg></button>
        <button type="button" id="addBtn" class="btn add-desktop"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>Añadir</button>
      </div>
    </header>
    <div id="view"></div>
  </main>

  <button type="button" id="fab" class="fab" aria-label="Añadir"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
</div>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <form id="form" method="dialog" autocomplete="off">
    <div class="sheet-head">
      <h2 id="sheetTitle">Nuevo</h2>
      <button type="button" class="text-btn" data-close>Cancelar</button>
    </div>

    <div class="field" id="fldQuick">
      <label for="quick">Escribe en una frase</label>
      <textarea id="quick" name="quick" rows="2" placeholder="examen métodos 20 nov 9:00 aula A3&#10;gimnasio cada lunes y jueves 18:00 #personal" aria-describedby="quickHint"></textarea>
      <p id="quickHint" class="hint" aria-live="polite"></p>
    </div>

    <fieldset class="seg">
      <legend class="sr">Tipo</legend>
      <label><input type="radio" name="type" value="task" checked><span>Tarea</span></label>
      <label><input type="radio" name="type" value="event"><span>Cita</span></label>
      <label><input type="radio" name="type" value="exam"><span>Examen</span></label>
    </fieldset>

    <label class="field"><span id="lblTitle">Tarea</span>
      <input name="title" required maxlength="120" enterkeyhint="done">
    </label>

    <div class="two">
      <label class="field"><span>Día</span><input type="date" name="date" required></label>
      <label class="field"><span>Hora (opcional)</span><input type="time" name="time"></label>
    </div>

    <label class="field" id="fldPlace" hidden><span id="lblPlace">Lugar</span><input name="place" maxlength="80"></label>

    <div class="two">
      <label class="field" id="fldRepeat"><span>Repetir</span>
        <select name="repeat">
          <option value="">Nunca</option>
          <option value="day:1">Cada día</option>
          <option value="weekdays:1">Días laborables</option>
          <option value="week:1">Cada semana</option>
          <option value="week:2">Cada 2 semanas</option>
          <option value="month:1">Cada mes</option>
        </select>
      </label>
      <label class="field"><span>Etiquetas</span><input name="tags" maxlength="80" placeholder="uni, personal" autocapitalize="none"></label>
    </div>

    <label class="field" id="fldPrio"><span>Prioridad</span>
      <select name="prio">
        <option value="0">Baja</option>
        <option value="1" selected>Media</option>
        <option value="2">Alta</option>
      </select>
    </label>

    <div class="field" id="fldSubs">
      <span id="lblSubs">Subtareas</span>
      <p id="subsHint" class="hint" hidden>Se reparten por días en tu agenda hasta el examen, con un repaso general el día antes.</p>
      <ul id="subList" class="subs"></ul>
      <div class="sub-add">
        <input id="subInput" maxlength="100" placeholder="Añadir subtarea" aria-label="Nueva subtarea">
        <button type="button" class="text-btn" id="subAddBtn">Añadir</button>
      </div>
    </div>

    <button type="button" id="focusBtn" class="ghost-btn" hidden><svg class="i" aria-hidden="true"><use href="#i-timer"/></svg>Concentrarme 25 min</button>

    <div class="sheet-foot">
      <button type="button" id="delBtn" class="danger" hidden><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>Eliminar</button>
      <button type="submit" class="btn">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="libSheet" aria-labelledby="libTitle">
  <form id="libForm" method="dialog" autocomplete="off">
    <div class="sheet-head">
      <h2 id="libTitle">Nuevo libro</h2>
      <button type="button" class="text-btn" data-close>Cancelar</button>
    </div>
    <label class="field"><span>Título</span><input name="title" required maxlength="120"></label>
    <div class="two">
      <label class="field"><span id="lblBy">Autor</span><input name="by" maxlength="80"></label>
      <label class="field"><span>Estado</span><select name="status"></select></label>
    </div>
    <div class="two" id="fldBook">
      <label class="field"><span>Páginas totales</span><input name="total" inputmode="numeric"></label>
      <label class="field"><span>Voy por la página</span><input name="cur" inputmode="numeric"></label>
    </div>
    <div class="two" id="fldGame" hidden>
      <label class="field"><span>Horas jugadas</span><input name="hours" inputmode="decimal"></label>
      <label class="field"><span>Progreso (%)</span><input name="pct" inputmode="numeric"></label>
    </div>
    <label class="field"><span>Valoración</span>
      <select name="rating">
        <option value="0">Sin valorar</option><option value="1">1 de 5</option><option value="2">2 de 5</option>
        <option value="3">3 de 5</option><option value="4">4 de 5</option><option value="5">5 de 5</option>
      </select>
    </label>
    <label class="field"><span>Notas</span><textarea name="notes" rows="3" maxlength="1000"></textarea></label>
    <div class="sheet-foot">
      <button type="button" id="libDel" class="danger" hidden><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>Eliminar</button>
      <button type="submit" class="btn">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="clsSheet" aria-labelledby="clsTitle">
  <form id="clsForm" method="dialog" autocomplete="off">
    <div class="sheet-head">
      <h2 id="clsTitle">Nueva clase</h2>
      <button type="button" class="text-btn" data-close>Cancelar</button>
    </div>
    <label class="field"><span>Asignatura</span><input name="name" required maxlength="80" placeholder="Métodos Cuantitativos"></label>
    <fieldset class="field days-pick">
      <legend>Días</legend>
      <div class="days-row">
        <label><input type="checkbox" name="day" value="1"><span>L</span><b class="sr">Lunes</b></label>
        <label><input type="checkbox" name="day" value="2"><span>M</span><b class="sr">Martes</b></label>
        <label><input type="checkbox" name="day" value="3"><span>X</span><b class="sr">Miércoles</b></label>
        <label><input type="checkbox" name="day" value="4"><span>J</span><b class="sr">Jueves</b></label>
        <label><input type="checkbox" name="day" value="5"><span>V</span><b class="sr">Viernes</b></label>
        <label><input type="checkbox" name="day" value="6"><span>S</span><b class="sr">Sábado</b></label>
        <label><input type="checkbox" name="day" value="0"><span>D</span><b class="sr">Domingo</b></label>
      </div>
    </fieldset>
    <div class="two">
      <label class="field"><span>Empieza</span><input type="time" name="start" required></label>
      <label class="field"><span>Termina</span><input type="time" name="end" required></label>
    </div>
    <div class="two">
      <label class="field"><span>Aula (opcional)</span><input name="place" maxlength="60" placeholder="Aula A3"></label>
      <label class="field"><span>Fin de clases (opcional)</span><input type="date" name="until"></label>
    </div>
    <div class="sheet-foot">
      <button type="button" id="clsDel" class="danger" hidden><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>Eliminar</button>
      <button type="submit" class="btn">Guardar</button>
    </div>
  </form>
</dialog>

<dialog id="walSheet" aria-labelledby="walTitle">
  <form id="walForm" method="dialog" autocomplete="off">
    <div class="sheet-head">
      <h2 id="walTitle">Nuevo movimiento</h2>
      <button type="button" class="text-btn" data-close>Cancelar</button>
    </div>
    <fieldset class="seg seg2">
      <legend class="sr">Tipo de movimiento</legend>
      <label><input type="radio" name="kind" value="out" checked><span>Gasto</span></label>
      <label><input type="radio" name="kind" value="in"><span>Ingreso</span></label>
    </fieldset>
    <div class="two">
      <label class="field"><span>Importe (€)</span><input name="amount" inputmode="decimal" required placeholder="0,00"></label>
      <label class="field"><span>Categoría</span><select name="cat"></select></label>
    </div>
    <label class="field"><span>Concepto (opcional)</span><input name="title" maxlength="120" enterkeyhint="done"></label>
    <div class="two">
      <label class="field"><span>Día</span><input type="date" name="date" required></label>
      <label class="w-check"><input type="checkbox" name="monthly"><span>Se repite cada mes</span></label>
    </div>
    <div class="sheet-foot">
      <button type="button" id="walDel" class="danger" hidden><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>Eliminar</button>
      <button type="submit" class="btn">Guardar</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="tip" class="tip" aria-hidden="true" hidden></div>
<div id="focus" class="focus" role="timer" aria-label="Pomodoro" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
